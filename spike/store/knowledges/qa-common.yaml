    # 공통 QA 원칙

    ## 목적
    - 화면이 "뜨는지"만이 아니라, 서비스가 의도한 업무를 끝까지 수행할 수 있는지 확인한다.
    - 확인한 사실은 반드시 검증 도구(expect_*)로 남긴다. 검증문이 곧 반복 테스트가 된다.

    ## 검증 기준
    - 화면 요소: 보이는지(expect_visible)뿐 아니라 글자·값·개수(expect_text / expect_value / expect_count)를 확인한다.
    - 데이터에 따라 바뀌는 값(건수, 날짜, 사용자 이름)은 꼭 필요할 때만 검증한다.
    - 새로 만든 데이터는 순서(n번째 행)가 아니라 이름으로 찾는다.
    - API: 4xx/5xx, 실패한 요청, 1초 이상 걸린 요청, 콘솔 오류는 바로 보고한다.
    - 화면과 API 응답이 서로 다르면 이상으로 보고한다.

    ## 키보드 탭 순서 (체크 포인트)
    - 입력 폼과 대화상자는 tab_order로 Tab 이동 순서를 확인한다.
    - 화면에 보이는 순서·논리 순서와 같은지, 빠지는 입력란·버튼이 없는지, 포커스가 갇히거나 엉뚱한 곳(사이드 메뉴 등)으로 빠지지 않는지 본다.
    - 대화상자가 열리면 포커스가 그 안으로 들어가고, 닫으면 연 요소로 돌아오는지 본다.
    - 테스트로 남길 때는 press Tab 뒤에 expect_focused로 검증한다.

    ## 테스트 데이터
    - 데이터를 새로 만들 때 이름 앞에 '[koa] '를 붙인다.
    - 사용자가 명시하지 않으면 등록·저장·삭제처럼 데이터를 바꾸는 버튼은 누르지 않는다.
    - 만든 데이터는 서비스가 허용하는 방법으로 정리할 수 있어야 한다(정리 방법은 서비스 지식에 적는다).

    ## 보고 형식
    - 끝나면 "확인한 것"과 "이상한 점"을 나눠 한국어로 짧게 요약한다.
    - 이상한 점에는 근거(화면, 요청 경로, 상태 코드, 걸린 시간)를 붙인다.
    - 추정은 추정이라고 밝힌다.
